<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>4인 미니게임 · 폭탄 돌리기</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#101425;color:#fff;text-align:center}main{max-width:720px;margin:auto;padding:18px}.card{background:#1b2138;border-radius:20px;padding:18px;margin:12px 0}input,button{font-size:18px;padding:14px;border:0;border-radius:14px;margin:5px}button{background:#ffd43b;font-weight:800;color:#161616}.secondary{background:#697386;color:white}#code{font-size:42px;font-weight:900;letter-spacing:8px}.hidden{display:none!important}#arena{position:relative;width:100%;aspect-ratio:1/1;background:#d9f2d0;border:6px solid #fff;border-radius:24px;overflow:hidden;touch-action:none}.p{position:absolute;width:64px;height:64px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:34px;border:4px solid white;transition:left .09s linear,top .09s linear}.dead{filter:grayscale(1);opacity:.35}.bomb:after{content:"💣";position:absolute;right:-18px;top:-22px;font-size:32px}.me{box-shadow:0 0 0 5px #ffd43b}.small{opacity:.75;font-size:14px}#fuse{font-size:28px;font-weight:900;color:#ff7b7b}</style></head>
<body><main><h1>💣 폭탄 돌리기</h1>
<section id="entry" class="card"><input id="name" maxlength="12" placeholder="닉네임"><br><button onclick="send('create')">방 만들기</button><br><input id="joinCode" inputmode="numeric" maxlength="4" placeholder="4자리 방 코드"><button class="secondary" onclick="send('join',{code:joinCode.value})">입장</button></section>
<section id="lobby" class="card hidden"><div>방 코드</div><div id="code"></div><div id="members"></div><button id="start" class="hidden" onclick="send('start')">START</button><div class="small">2~4명 입장 후 방장이 시작합니다.</div></section>
<section id="game" class="hidden"><div class="card"><span id="fuse"></span> <span id="status"></span></div><div id="arena"></div><button id="rematch" class="hidden" onclick="send('rematch')">재경기</button></section>
</main><script>
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');let me=null,state=null;
function send(action,extra={}){if(ws.readyState!==1)return;ws.send(JSON.stringify({action,name:document.getElementById('name').value||'플레이어',...extra}))}
ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='error'){alert(d.message);return}if(d.type==='joined'){me=d.id;entry.classList.add('hidden');lobby.classList.remove('hidden')}if(d.type==='state'){state=d;render()}}
function render(){code.textContent=state.code;members.textContent=state.players.map(p=>(p.id===state.host?'👑 ':'')+p.name).join(' · ');start.classList.toggle('hidden',!(me===state.host&&state.status==='lobby'&&state.players.length>=2));
if(state.status==='lobby')return; lobby.classList.add('hidden');game.classList.remove('hidden');fuse.textContent=state.status==='playing'?'⏱ '+state.fuse.toFixed(1):'';status.textContent=state.status==='playing'?'폭탄을 넘기세요!':'게임 종료';
arena.innerHTML='';for(const p of state.players){let el=document.createElement('div');el.className='p '+(p.id===me?'me ':'')+(!p.alive?'dead ':'')+(state.bomb===p.id?'bomb ':'');el.style.left=p.x*100+'%';el.style.top=p.y*100+'%';el.textContent=p.alive?'🏃':'💥';el.title=p.name;arena.appendChild(el)}
if(state.status==='finished'){let w=state.players.find(p=>p.id===state.winner);status.textContent=w?'🏆 '+w.name+' 승리!':'무승부';rematch.classList.toggle('hidden',me!==state.host)}else rematch.classList.add('hidden')}
function move(e){if(!state||state.status!=='playing')return;let r=arena.getBoundingClientRect(),t=e.touches?e.touches[0]:e;send('move',{x:(t.clientX-r.left)/r.width,y:(t.clientY-r.top)/r.height})}
arena.addEventListener('pointerdown',move);arena.addEventListener('pointermove',e=>{if(e.buttons)move(e)});
</script></body></html>
